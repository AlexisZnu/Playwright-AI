name: Pruebas Playwright

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci_playwright:
        runs-on: ubuntu-22.04

        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                node-version: '18'

            - name: Install dependencies
              run: pnpm install

            - name: Run Playwright tests
              run: pnpm test        